name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: scoring-api/ScoringApi.sln

jobs:
  build-and-unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('scoring-api/**/*.csproj', 'scoring-api/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Unit tests with coverage
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-build
          --filter "Category!=Integration"
          --settings scoring-api/coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --logger trx
          --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults
          if-no-files-found: warn

  integration:
    name: Integration tests (Oracle via Testcontainers)
    needs: build-and-unit
    runs-on: ubuntu-latest
    # The first pull of gvenzl/oracle-free plus database start-up takes a few minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('scoring-api/**/*.csproj', 'scoring-api/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pre-pull Oracle image
        run: docker pull gvenzl/oracle-free:23-slim

      - name: Integration tests
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release
          --filter "Category=Integration"
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults
          if-no-files-found: warn

  js-lint:
    name: ESLint (Creatio client schemas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exported package (creatio/packages) and sources waiting for the export (creatio/src).
      - run: npx eslint "creatio/**/*.js"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0

      # The CLI is used instead of gitleaks-action: the action scans only the commit range of the
      # push event ("<first>^..<last>"), which fails on the first push of a repository because the
      # root commit has no parent. Scanning the whole history works for every event.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          # SHA-256 of gitleaks_8.24.3_linux_x64.tar.gz from the release's checksums.txt.
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
